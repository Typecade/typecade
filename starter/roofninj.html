<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rooftop Ninja</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1338; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById("c"), cx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, U = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = Math.min(W, H) / 100;
  }
  window.addEventListener("resize", () => { resize(); if (state !== "play") reset(); });

  let ac = null;
  const wake = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } };
  function beep(f, d = 0.07, type = "triangle", v = 0.05, slide = 0) {
    if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }

  let state = "title", t = 0, ninja, roofs, stars, parts, scroll, speed, score, best = 0, jumps, shake = 0, flash = 0, overAt = 0, held = false;
  const skyline = Array.from({ length: 30 }, (_, i) => ({ x: i / 30, h: 0.2 + ((i * 37) % 17) / 40 }));

  function makeRoof(x) {
    const w = U * (26 + Math.random() * 30) + Math.min(U * 20, scroll * 0.002);
    const prev = roofs.length ? roofs[roofs.length - 1].y : H * 0.68;
    const y = Math.max(H * 0.45, Math.min(H * 0.82, prev + (Math.random() - 0.5) * H * 0.18));
    const roof = { x, y, w };
    roofs.push(roof);
    // stars to grab above the roof, sometimes a spike box (spike: its distance from the roof's left edge, so it scrolls with the roof)
    if (Math.random() < 0.8) for (let i = 0; i < 3; i++) stars.push({ x: x + w * (0.25 + i * 0.25), y: y - U * (10 + Math.sin(i) * 4), got: false });
    if (w > U * 34 && Math.random() < 0.45) roof.spike = w * (0.45 + Math.random() * 0.3);
    return roof;
  }
  function reset() {
    ninja = { x: W * 0.25, y: H * 0.6, vy: 0, ground: true, flip: 0 };
    roofs = []; stars = []; parts = []; scroll = 0; speed = U * 42; score = 0; jumps = 0;
    // the first roof gives about two seconds of run-up before the first gap, on a phone too
    const first = Math.max(W * 0.6, W * 0.25 + U * 95);
    roofs.push({ x: -U * 10, y: H * 0.68, w: first });
    let x = first + U * 12; while (x < W * 2) { const r = makeRoof(x); x = r.x + r.w + gapW(); }
  }
  const gapW = () => U * (10 + Math.random() * 10) + Math.min(U * 14, scroll * 0.0012);
  function start() { wake(); reset(); state = "play"; beep(392, 0.12, "square", 0.04, 200); }
  function jump() {
    if (state !== "play") return;
    if (ninja.ground || jumps < 2) {
      ninja.vy = -H * (jumps === 0 ? 1.15 : 1.0); jumps++; ninja.ground = false; if (jumps === 2) ninja.flip = 1;
      beep(jumps === 1 ? 520 : 780, 0.08, "square", 0.04, 300);
      for (let i = 0; i < 8; i++) parts.push({ x: ninja.x, y: ninja.y, vx: (Math.random() - 0.5) * 120, vy: Math.random() * 80, life: 0.4, t: 0, c: "#ffc2e2" });
    }
  }
  function die(why) {
    state = "over"; best = Math.max(best, score); overAt = performance.now(); shake = 16; flash = 0.6;
    beep(180, 0.5, "sawtooth", 0.07, -120);
  }

  function update(dt) {
    t += dt;
    if (state === "play") {
      speed = U * 42 + scroll * 0.004; const dx = speed * dt; scroll += dx;
      for (const r of roofs) r.x -= dx; for (const s of stars) s.x -= dx;
      roofs = roofs.filter((r) => r.x + r.w > -U * 20); stars = stars.filter((s) => s.x > -20 && !s.got);
      const lastR = roofs[roofs.length - 1]; if (lastR.x + lastR.w < W * 1.6) makeRoof(lastR.x + lastR.w + gapW());
      score = Math.floor(scroll / (U * 2)) + 0;
      // gravity: falls faster than it rises, holding the button floats a little
      const g = H * (ninja.vy > 0 ? 3.4 : held ? 2.2 : 3.0);
      ninja.vy += g * dt; const ny = ninja.y + ninja.vy * dt;
      const r = roofs.find((r) => ninja.x > r.x && ninja.x < r.x + r.w);
      if (r && ninja.vy >= 0 && ninja.y <= r.y + 2 && ny >= r.y) { ninja.y = r.y; ninja.vy = 0; if (!ninja.ground) { for (let i = 0; i < 6; i++) parts.push({ x: ninja.x, y: r.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 60, life: 0.3, t: 0, c: "#c9a6ff" }); } ninja.ground = true; jumps = 0; }
      else { ninja.y = ny; ninja.ground = false; }
      if (r && r.spike && Math.abs(ninja.x - (r.x + r.spike)) < U * 3.5 && ninja.y > r.y - U * 5) return die("spike");
      if (r && ninja.y > r.y + U * 4 && ninja.x > r.x + U * 2) { ninja.vy = Math.max(ninja.vy, 0); }
      if (ninja.y > H + U * 10) return die("fall");
      ninja.flip = Math.max(0, ninja.flip - dt * 2.5);
      for (const s of stars) if (!s.got && Math.hypot(s.x - ninja.x, s.y - (ninja.y - U * 5)) < U * 5) {
        s.got = true; scroll += U * 30; beep(1046 + Math.random() * 200, 0.07, "square", 0.04, 400); flash = 0.12;
        for (let i = 0; i < 10; i++) { const a = Math.random() * 7; parts.push({ x: s.x, y: s.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0.5, t: 0, c: "#ffd166" }); }
      }
      if (Math.random() < 0.6) parts.push({ x: ninja.x - U * 2.6, y: ninja.y - U * 5.4, vx: -60 - Math.random() * 40, vy: (Math.random() - 0.5) * 20, life: 0.35, t: 0, c: "#ff4d8d", band: true });
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.t < p.life);
    shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 2);
  }

  function txt(s, x, y, size, col, align = "center", w = 800) {
    cx.font = `${w} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; cx.textAlign = align; cx.textBaseline = "middle";
    // lines too wide for the screen wrap onto more lines below the first
    let lines = [String(s)];
    if (align === "center" && cx.measureText(lines[0]).width > W - 32) {
      lines = []; let cur = "";
      for (const word of String(s).split(" ")) { const tryL = cur ? cur + " " + word : word; if (cur && cx.measureText(tryL).width > W - 32) { lines.push(cur); cur = word; } else cur = tryL; }
      lines.push(cur);
    }
    lines.forEach((l, i) => { const yy = y + i * size * 1.2; cx.fillStyle = "rgba(0,0,0,0.5)"; cx.fillText(l, x + 2, yy + 3); cx.fillStyle = col; cx.fillText(l, x, yy); });
  }
  function drawNinja(x, y) {
    const s = U * 0.85, run = state === "play" && ninja.ground ? Math.sin(t * 22) : 0.6;
    cx.save(); cx.translate(x, y);
    if (ninja.flip > 0) { cx.translate(0, -5 * s); cx.rotate((1 - ninja.flip) * Math.PI * 2); cx.translate(0, 5 * s); }
    cx.strokeStyle = "#1a0f24"; cx.lineWidth = s * 1.3; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-0.6 * s, -2 * s); cx.lineTo(-1.6 * s + run * 1.6 * s, 0); cx.moveTo(0.6 * s, -2 * s); cx.lineTo(1.4 * s - run * 1.6 * s, 0); cx.stroke();
    cx.fillStyle = "#1a0f24"; cx.beginPath(); cx.roundRect(-1.8 * s, -6.4 * s, 3.6 * s, 4.8 * s, 1.2 * s); cx.fill();
    cx.beginPath(); cx.arc(0, -8.2 * s, 2.4 * s, 0, 7); cx.fill();
    // headband and eyes
    cx.fillStyle = "#ff4d8d"; cx.fillRect(-2.4 * s, -8.9 * s, 4.8 * s, 1 * s);
    cx.fillStyle = "#fff"; cx.fillRect(0.2 * s, -8.3 * s, 0.8 * s, 0.6 * s); cx.fillRect(1.4 * s, -8.3 * s, 0.6 * s, 0.6 * s);
    cx.strokeStyle = "#1a0f24"; cx.lineWidth = s; cx.beginPath(); cx.moveTo(1.6 * s, -5 * s); cx.lineTo(3.4 * s, -5.6 * s + run * s); cx.stroke();
    cx.restore();
  }
  function draw() {
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#2a1338"); g.addColorStop(0.55, "#a3306a"); g.addColorStop(1, "#ff9e5e");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.save(); if (shake) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // the big moon and the far city, both drift slower than the roofs
    cx.fillStyle = "#ffe3c4"; cx.beginPath(); cx.arc(W * 0.84, H * 0.12, U * 9, 0, 7); cx.fill();
    for (const [k, col] of [[0.05, "#5c2257"], [0.15, "#3d1640"]]) {
      cx.fillStyle = col;
      for (const b of skyline) { const x = ((b.x * W * 1.4 - scroll * k) % (W * 1.4) + W * 1.4) % (W * 1.4) - W * 0.2; cx.fillRect(x, H * (1 - b.h * (k > 0.1 ? 0.8 : 1)), W / 22, H); }
    }
    if (state !== "title") {
      for (const r of roofs) {
        cx.fillStyle = "#1a0f24"; cx.fillRect(r.x, r.y, r.w, H - r.y);
        cx.fillStyle = "#3a2050"; cx.fillRect(r.x, r.y, r.w, U * 1.4);
        cx.fillStyle = "#ffd16655"; for (let wx = r.x + U * 4; wx < r.x + r.w - U * 4; wx += U * 7) for (let wy = r.y + U * 6; wy < H; wy += U * 9) if (((wx + wy) | 0) % 3) cx.fillRect(wx, wy, U * 2.4, U * 3);
        if (r.spike) { const sx = r.x + r.spike; cx.fillStyle = "#c9c2d6"; for (let i = -1; i <= 1; i++) { cx.beginPath(); cx.moveTo(sx + i * U * 2 - U, r.y); cx.lineTo(sx + i * U * 2, r.y - U * 3.4); cx.lineTo(sx + i * U * 2 + U, r.y); cx.fill(); } }
      }
      for (const s of stars) {
        cx.save(); cx.translate(s.x, s.y); cx.rotate(t * 6); cx.fillStyle = "#ffd166";
        cx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? U * 1 : U * 2.6; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); cx.fill();
        cx.fillStyle = "#1a0f24"; cx.beginPath(); cx.arc(0, 0, U * 0.6, 0, 7); cx.fill(); cx.restore();
      }
      for (const p of parts) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c; if (p.band) cx.fillRect(p.x, p.y, U * 1.2, U * 0.6); else cx.fillRect(p.x, p.y, 3, 3); }
      cx.globalAlpha = 1;
      drawNinja(ninja.x, ninja.y);
    } else drawNinja(W / 2, H * 0.66);
    cx.restore();
    if (flash) { cx.fillStyle = `rgba(255,240,220,${flash * 0.3})`; cx.fillRect(0, 0, W, H); }
    const s = Math.min(W, H);
    if (state === "play" && !COVER) { txt(score + " m", 20, 34, U * 6, "#fff3e6", "left"); txt("Best " + best + " m", W - 20, 34, U * 3.4, "#ffd166", "right", 700); }
    if (state === "title") {
      txt("ROOFTOP NINJA", W / 2, H * 0.24, s * 0.11, "#fff3e6");
      txt("Run the city at sunset. Never touch the street.", W / 2, H * 0.24 + s * 0.1, Math.max(15, s * 0.038), "#ffe0ef", "center", 600);
      txt("Jump twice for a flip. Throwing stars push you further. Spikes hurt.", W / 2, H * 0.24 + s * 0.155, Math.max(12, s * 0.028), "#ffd0e4", "center", 600);
      txt("Space / ↑ / tap to jump · hold to float", W / 2, H * 0.84, Math.max(13, s * 0.03), "#ffe0ef", "center", 700);
      txt("Press Space or tap to start", W / 2, H * 0.91, Math.max(16, s * 0.045), `rgba(255,255,255,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
    if (state === "over") {
      cx.fillStyle = "rgba(42,19,56,0.6)"; cx.fillRect(0, 0, W, H);
      txt("WIPEOUT", W / 2, H * 0.32, s * 0.13, "#ff4d8d");
      txt(score + " m across the city", W / 2, H * 0.32 + s * 0.11, Math.max(16, s * 0.045), "#fff3e6");
      txt("Best this session " + best + " m", W / 2, H * 0.32 + s * 0.17, Math.max(14, s * 0.035), "#ffd166", "center", 700);
      txt("Press Space or tap to run again", W / 2, H * 0.74, Math.max(16, s * 0.042), `rgba(255,255,255,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
  }

  const press = () => { wake(); held = true; if (state === "play") return jump(); if (performance.now() - overAt > 450) start(); };
  window.addEventListener("keydown", (e) => { if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); } });
  window.addEventListener("keyup", (e) => { if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) held = false; });
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  window.addEventListener("pointerup", () => (held = false));
  window.addEventListener("blur", () => (held = false));
  ["touchstart", "touchmove"].forEach((ev) => cv.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));

  let last = performance.now(), hidden = false;
  document.addEventListener("visibilitychange", () => { hidden = document.hidden; last = performance.now(); held = false; });
  function frame(now) { const dt = Math.min(1 / 30, (now - last) / 1000); last = now; if (!hidden) { update(dt); draw(); } requestAnimationFrame(frame); }
  // #cover: a still for the thumbnail (the ninja mid-flip over a gap between two roofs, stars ahead, no HUD)
  const COVER = location.hash === "#cover";
  resize(); reset();
  if (COVER) {
    state = "play"; t = 0.05;
    roofs = [{ x: -U * 10, y: H * 0.7, w: W * 0.42 + U * 10 }, { x: W * 0.58, y: H * 0.64, w: W * 0.6, spike: W * 0.32 }];
    stars = [0, 1, 2].map((i) => ({ x: W * (0.6 + i * 0.09), y: H * 0.5 - Math.sin(i + 0.5) * U * 3, got: false }));
    ninja = { x: W * 0.48, y: H * 0.5, vy: -1, ground: false, flip: 0.55 };
    for (let i = 0; i < 10; i++) parts.push({ x: W * 0.48 - U * (3 + i * 2.4), y: H * 0.5 + U * (1 + i * 1.3), vx: 0, vy: 0, life: 1, t: i * 0.08, c: "#ffc2e2" });
    update = () => {};
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
