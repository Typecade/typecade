<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rainy Day Cat</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b4a; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById("c"), cx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, U = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = Math.min(W, H) / 100;
  }
  window.addEventListener("resize", resize);

  let ac = null;
  const wake = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } };
  function beep(f, d = 0.07, type = "sine", v = 0.06, slide = 0) {
    if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }

  const rain = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.8 }));
  let state = "title", t = 0, cat, items, parts, pops, score, best = 0, lives, combo, spawnT, level, shake = 0, lightning = 0, keys = {}, targetX = null, overAt = 0;

  function reset() { cat = { x: W / 2, vx: 0, face: 1, happy: 0, sad: 0 }; items = []; parts = []; pops = []; score = 0; lives = 3; combo = 0; spawnT = 0.6; level = 1; }
  function start() { wake(); reset(); state = "play"; beep(660, 0.12, "triangle", 0.05, 300); }

  function spawn() {
    const r = Math.random();
    const kind = r < 0.12 + level * 0.015 ? "boot" : r < 0.2 + level * 0.015 ? "gold" : "fish";
    items.push({ kind, x: U * 8 + Math.random() * (W - U * 16), y: -U * 6, vy: U * (24 + level * 3 + Math.random() * 10), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4, sway: Math.random() * 6 });
  }
  function pop(x, y, s, col) { pops.push({ x, y, s, col, t: 0 }); }

  function update(dt) {
    t += dt;
    for (const d of rain) { d.y += dt * d.s * 1.4; d.x -= dt * d.s * 0.12; if (d.y > 1) { d.y = 0; d.x = Math.random() * 1.1; } }
    if (state === "play") {
      level = 1 + Math.floor(score / 250);
      const kdir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
      if (kdir) { targetX = null; cat.vx = kdir * U * 95; cat.face = kdir; }
      else if (targetX !== null) { const d = targetX - cat.x; cat.vx = Math.max(-U * 140, Math.min(U * 140, d * 10)); if (Math.abs(d) > 4) cat.face = Math.sign(d); }
      else cat.vx *= 0.8;
      cat.x = Math.max(U * 8, Math.min(W - U * 8, cat.x + cat.vx * dt));
      spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.05 - level * 0.08) * (0.6 + Math.random() * 0.8); }
      const cy = H - U * 14;
      for (const it of items) {
        it.y += it.vy * dt; it.rot += it.vr * dt; it.x += Math.sin(t * 2 + it.sway) * U * 6 * dt;
        if (!it.done && it.y > cy - U * 6 && it.y < cy + U * 4 && Math.abs(it.x - cat.x) < U * 9) {
          it.done = true;
          if (it.kind === "boot") { lives--; combo = 0; cat.sad = 1; shake = 12; beep(140, 0.35, "sawtooth", 0.07, -60); pop(it.x, it.y, "OUCH", "#ff6b6b"); if (lives <= 0) { state = "over"; best = Math.max(best, score); overAt = performance.now(); } }
          else {
            combo++; const pts = (it.kind === "gold" ? 50 : 10) * Math.min(5, 1 + Math.floor(combo / 5)); score += pts; cat.happy = 0.6;
            beep(it.kind === "gold" ? 1175 : 784 + Math.min(combo, 20) * 20, 0.08, "triangle", 0.06, 200);
            pop(it.x, it.y - U * 4, "+" + pts, it.kind === "gold" ? "#ffd166" : "#bdf2ff");
            for (let i = 0; i < 12; i++) { const a = Math.random() * 7; parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140 - 80, life: 0.6, t: 0, c: it.kind === "gold" ? "#ffd166" : "#9fe7ff" }); }
          }
        }
        if (!it.done && it.y > H + U * 6) { it.done = true; if (it.kind !== "boot") { combo = 0; pop(it.x, H - U * 4, "splash", "#7aa7d9"); } }
      }
      items = items.filter((it) => !it.done);
      if (Math.random() < dt * 0.04) { lightning = 1; beep(60, 0.6, "sawtooth", 0.05, -20); }
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
    parts = parts.filter((p) => p.t < p.life);
    for (const p of pops) p.t += dt; pops = pops.filter((p) => p.t < 0.9);
    if (cat) { cat.happy = Math.max(0, cat.happy - dt); cat.sad = Math.max(0, cat.sad - dt); }
    shake = Math.max(0, shake - dt * 40); lightning = Math.max(0, lightning - dt * 2.2);
  }

  function txt(s, x, y, size, col, align = "center", w = 800) {
    cx.font = `${w} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; cx.textAlign = align; cx.textBaseline = "middle";
    // lines too wide for the screen wrap onto more lines below the first
    let lines = [String(s)];
    if (align === "center" && cx.measureText(lines[0]).width > W - 32) {
      lines = []; let cur = "";
      for (const word of String(s).split(" ")) { const tryL = cur ? cur + " " + word : word; if (cur && cx.measureText(tryL).width > W - 32) { lines.push(cur); cur = word; } else cur = tryL; }
      lines.push(cur);
    }
    lines.forEach((l, i) => { const yy = y + i * size * 1.2; cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillText(l, x + 2, yy + 3); cx.fillStyle = col; cx.fillText(l, x, yy); });
  }
  function fish(x, y, rot, gold) {
    cx.save(); cx.translate(x, y); cx.rotate(rot); const s = U * 1.1;
    cx.fillStyle = gold ? "#ffd166" : "#7fd3ff";
    cx.beginPath(); cx.ellipse(0, 0, 4 * s, 2.2 * s, 0, 0, 7); cx.fill();
    cx.beginPath(); cx.moveTo(3 * s, 0); cx.lineTo(6.2 * s, -2.2 * s); cx.lineTo(6.2 * s, 2.2 * s); cx.closePath(); cx.fill();
    cx.fillStyle = gold ? "#f4a52a" : "#4aa8e0"; cx.beginPath(); cx.ellipse(0.5 * s, 0.8 * s, 2.4 * s, 0.9 * s, 0, 0, 7); cx.fill();
    cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(-2.3 * s, -0.5 * s, 0.8 * s, 0, 7); cx.fill();
    cx.fillStyle = "#1d2b4a"; cx.beginPath(); cx.arc(-2.5 * s, -0.5 * s, 0.4 * s, 0, 7); cx.fill();
    if (gold) { cx.fillStyle = "#fff6d6"; cx.fillRect(-1 * s, -1.7 * s, 0.6 * s, 0.6 * s); }
    cx.restore();
  }
  function boot(x, y, rot) {
    cx.save(); cx.translate(x, y); cx.rotate(rot); const s = U * 1.1;
    cx.fillStyle = "#6b4f3a"; cx.beginPath(); cx.roundRect(-2.2 * s, -4 * s, 3.6 * s, 6 * s, 1 * s); cx.fill();
    cx.beginPath(); cx.roundRect(-2.2 * s, 0.6 * s, 6 * s, 2.4 * s, 1.2 * s); cx.fill();
    cx.fillStyle = "#3e2c20"; cx.fillRect(-2.2 * s, 2.4 * s, 6 * s, 0.7 * s);
    cx.strokeStyle = "#a0826b"; cx.lineWidth = 1.5; for (let i = 0; i < 3; i++) { cx.beginPath(); cx.moveTo(-1.6 * s, (-3 + i * 1.2) * s); cx.lineTo(0.8 * s, (-3 + i * 1.2) * s); cx.stroke(); }
    cx.restore();
  }
  function drawCat(x, y, face) {
    const s = U * 1.3, bob = Math.sin(t * (Math.abs(cat ? cat.vx : 0) > 5 ? 14 : 3)) * s * 0.3, happy = cat && cat.happy > 0, sad = cat && cat.sad > 0;
    cx.save(); cx.translate(x, y + bob); cx.scale(face, 1);
    // tail
    cx.strokeStyle = "#f29e4c"; cx.lineWidth = s * 1.3; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-4 * s, 1 * s); cx.quadraticCurveTo(-8 * s, -1 * s + Math.sin(t * 5) * s, -7 * s, -5 * s); cx.stroke();
    // body and bucket
    cx.fillStyle = "#f29e4c"; cx.beginPath(); cx.ellipse(0, 1.5 * s, 5 * s, 3.6 * s, 0, 0, 7); cx.fill();
    cx.fillStyle = "#ffe0bf"; cx.beginPath(); cx.ellipse(1 * s, 2.4 * s, 2.6 * s, 2 * s, 0, 0, 7); cx.fill();
    // head
    cx.fillStyle = "#f29e4c";
    cx.beginPath(); cx.moveTo(-1.6 * s, -6.6 * s); cx.lineTo(-0.4 * s, -10 * s); cx.lineTo(1.2 * s, -7 * s); cx.fill();
    cx.beginPath(); cx.moveTo(2.6 * s, -7 * s); cx.lineTo(4.4 * s, -10 * s); cx.lineTo(5.2 * s, -6.2 * s); cx.fill();
    cx.beginPath(); cx.arc(2 * s, -4.8 * s, 3.6 * s, 0, 7); cx.fill();
    cx.fillStyle = "#ffb6c1"; cx.beginPath(); cx.moveTo(-0.6 * s, -7.4 * s); cx.lineTo(-0.3 * s, -8.8 * s); cx.lineTo(0.6 * s, -7.3 * s); cx.fill();
    // face
    cx.fillStyle = "#2b2140"; cx.strokeStyle = "#2b2140"; cx.lineWidth = s * 0.45;
    if (happy) { for (const ex of [0.8, 3.4]) { cx.beginPath(); cx.arc(ex * s, -5.2 * s, 0.7 * s, Math.PI, 0); cx.stroke(); } }
    else if (sad) { for (const ex of [0.8, 3.4]) { cx.beginPath(); cx.moveTo((ex - 0.7) * s, -5.6 * s); cx.lineTo((ex + 0.7) * s, -4.8 * s); cx.stroke(); } }
    else { for (const ex of [0.8, 3.4]) { cx.beginPath(); cx.arc(ex * s, -5.1 * s, 0.6 * s, 0, 7); cx.fill(); } }
    cx.fillStyle = "#ff8fa3"; cx.beginPath(); cx.arc(2.1 * s, -3.9 * s, 0.4 * s, 0, 7); cx.fill();
    cx.lineWidth = s * 0.25; cx.beginPath(); cx.arc(1.7 * s, -3.4 * s, 0.45 * s, 0, Math.PI); cx.arc(2.6 * s, -3.4 * s, 0.45 * s, 0, Math.PI); cx.stroke();
    cx.strokeStyle = "rgba(255,255,255,0.7)"; cx.lineWidth = 1;
    for (const [a, b] of [[-0.6, -0.3], [-0.6, 0.3]]) { cx.beginPath(); cx.moveTo(4.6 * s, -3.8 * s); cx.lineTo(7.2 * s, (-3.8 + a * 1.4) * s); cx.stroke(); cx.beginPath(); cx.moveTo(-0.4 * s, -3.8 * s); cx.lineTo(-2.8 * s, (-3.8 + b * 1.4) * s); cx.stroke(); }
    // a little yellow raincoat hood
    cx.fillStyle = "#ffd166"; cx.beginPath(); cx.arc(2 * s, -7.4 * s, 3.3 * s, Math.PI * 1.08, Math.PI * 1.92); cx.lineTo(5 * s, -6.4 * s); cx.lineTo(-1 * s, -6.4 * s); cx.closePath(); cx.fill();
    cx.restore();
  }

  function draw() {
    // the street level: the bottom of the screen, or higher up in the cover still so the cat sits mid-frame
    const B = COVER ? H * 0.76 : H;
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#1d2b4a"); g.addColorStop(1, "#3c4f7a");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.save(); if (shake) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // rooftops in the back
    cx.fillStyle = "#16213a";
    for (let i = 0; i < 9; i++) { const bw = W / 8, bh = H * (0.18 + ((i * 37) % 10) / 60); cx.fillRect(i * bw - 10, B - bh - U * 10, bw - 6, bh + H - B); }
    cx.fillStyle = "#ffd16644"; for (let i = 0; i < 18; i++) { const wx = ((i * 97) % 100) / 100 * W, wy = B - U * 14 - ((i * 53) % 30) / 100 * H; cx.fillRect(wx, wy, U * 1.4, U * 1.8); }
    // ground puddles
    cx.fillStyle = "#2c3d63"; cx.fillRect(0, B - U * 9, W, U * 9 + H - B);
    cx.fillStyle = "#4b6a9b55"; for (let i = 0; i < 5; i++) { cx.beginPath(); cx.ellipse(((i * 211) % 100) / 100 * W, B - U * 4, U * 8, U * 1.4, 0, 0, 7); cx.fill(); }
    cx.strokeStyle = "rgba(190,215,255,0.45)"; cx.lineWidth = 1.3;
    for (const d of rain) { cx.beginPath(); cx.moveTo(d.x * W, d.y * H); cx.lineTo(d.x * W - 3, d.y * H + 12 * d.s); cx.stroke(); }
    if (state !== "title") {
      for (const it of items) it.kind === "boot" ? boot(it.x, it.y, it.rot) : fish(it.x, it.y, it.rot, it.kind === "gold");
      drawCat(cat.x, B - U * 14, cat.face);
    } else drawCat(W / 2, H * 0.68, 1);
    for (const p of parts) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 2.5, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
    for (const p of pops) { cx.globalAlpha = 1 - p.t / 0.9; txt(p.s, p.x, p.y - p.t * 40, U * 3.4, p.col); }
    cx.globalAlpha = 1; cx.restore();
    if (lightning) { cx.fillStyle = `rgba(230,240,255,${lightning * 0.5})`; cx.fillRect(0, 0, W, H); }
    const s = Math.min(W, H);
    if (state === "play" && !COVER) {
      txt(String(score), 20, 34, U * 6, "#fff6d6", "left");
      if (combo >= 5) txt("COMBO x" + Math.min(5, 1 + Math.floor(combo / 5)), 20, 34 + U * 6, U * 3, "#ffd166", "left");
      txt("🐟".repeat(Math.max(0, lives)), W - 20, 34, U * 4.4, "#fff", "right");
    }
    if (state === "title") {
      txt("RAINY DAY CAT", W / 2, H * 0.22, s * 0.11, "#ffd166");
      txt("Catch the fish. Dodge the boots.", W / 2, H * 0.22 + s * 0.1, Math.max(15, s * 0.04), "#f4f7ff", "center", 600);
      txt("Golden fish are worth five. Five in a row starts a combo.", W / 2, H * 0.22 + s * 0.155, Math.max(13, s * 0.03), "#bcd0f2", "center", 600);
      txt("← → / A D  ·  drag on phone", W / 2, H * 0.86, Math.max(13, s * 0.03), "#bcd0f2", "center", 700);
      txt("Press Space or tap to start", W / 2, H * 0.92, Math.max(16, s * 0.045), `rgba(255,209,102,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
    if (state === "over") {
      cx.fillStyle = "rgba(20,28,50,0.65)"; cx.fillRect(0, 0, W, H);
      txt("SOAKED!", W / 2, H * 0.32, s * 0.13, "#7fd3ff");
      txt(score + " points", W / 2, H * 0.32 + s * 0.11, Math.max(16, s * 0.05), "#fff6d6");
      txt("Best this session " + best, W / 2, H * 0.32 + s * 0.17, Math.max(14, s * 0.035), "#ffd166", "center", 700);
      txt("Press Space or tap to play again", W / 2, H * 0.74, Math.max(16, s * 0.042), `rgba(255,255,255,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
  }

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (state !== "play" && performance.now() - overAt > 400) start(); }
    if (e.code.startsWith("Arrow")) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => (keys[e.code] = false));
  window.addEventListener("blur", () => (keys = {}));
  let dragging = false;
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); if (state !== "play") { if (performance.now() - overAt > 400) start(); return; } dragging = true; targetX = e.clientX; });
  cv.addEventListener("pointermove", (e) => { if (state === "play" && (dragging || e.pointerType === "mouse")) targetX = e.clientX; });
  window.addEventListener("pointerup", () => { dragging = false; });
  ["touchstart", "touchmove"].forEach((ev) => cv.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));

  let last = performance.now(), hidden = false;
  document.addEventListener("visibilitychange", () => { hidden = document.hidden; last = performance.now(); });
  function frame(now) { const dt = Math.min(1 / 30, (now - last) / 1000); last = now; if (!hidden) { update(dt); draw(); } requestAnimationFrame(frame); }
  // #cover: a still for the thumbnail (the cat mid-frame reaching for a fish, a golden one and a boot in the rain, no HUD)
  const COVER = location.hash === "#cover";
  resize(); reset();
  if (COVER) {
    state = "play"; cat.x = W * 0.46; cat.face = 1; cat.happy = 1;
    items = [
      { kind: "fish", x: W * 0.62, y: H * 0.46, vy: 0, rot: 0.5, vr: 0, sway: 0 },
      { kind: "gold", x: W * 0.28, y: H * 0.3, vy: 0, rot: -0.4, vr: 0, sway: 0 },
      { kind: "boot", x: W * 0.74, y: H * 0.22, vy: 0, rot: 0.3, vr: 0, sway: 0 },
    ];
    update = () => {};
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
