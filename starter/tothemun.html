<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>To The Moon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d24; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById("c"), cx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, U = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = Math.min(W, H) / 100; // one unit: 1 % of the short side
  }
  window.addEventListener("resize", resize);

  let ac = null;
  const wake = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } };
  function beep(f, d = 0.08, type = "sine", v = 0.06, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  }

  // stars in three depths
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: 0.2 + Math.random() * 0.8 }));
  let state = "title", t = 0, rocket, obs, coins, parts, dist, best = 0, speed, shake = 0, flash = 0, holding = false, overAt = 0;

  function reset() {
    rocket = { y: H * 0.5, vy: 0, tilt: 0 };
    obs = []; coins = []; parts = []; dist = 0; speed = 34;
  }
  // distance -> market cap: starts at $5k, the moon is $1B
  const mcap = (d) => { const v = 5000 * Math.pow(1.045, d); return v >= 1e9 ? "$1B 🌕" : v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : "$" + (v / 1e3).toFixed(1) + "k"; };

  function start() { wake(); reset(); state = "play"; beep(300, 0.25, "sawtooth", 0.05, 500); }
  function die() {
    state = "over"; best = Math.max(best, dist); shake = 16; flash = 1; overAt = performance.now(); holding = false;
    for (let i = 0; i < 50; i++) { const a = Math.random() * 7, v = 60 + Math.random() * 260; parts.push({ x: W * 0.28, y: rocket.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9, t: 0, c: Math.random() < 0.5 ? "#ff7a45" : "#ffd166", r: 2 + Math.random() * 4 }); }
    beep(120, 0.6, "sawtooth", 0.08, -80);
  }

  function spawn() {
    // a bear paw from the top or bottom, or a FUD cloud in the middle, leaving a gap the rocket can fly through
    const gap = Math.max(H * 0.26, H * 0.42 - dist * 0.12);
    // the next gap is never far above or below the last one, so every pair of paws can be flown
    const lo = H * 0.18 + gap / 2, hi = H * 0.82 - gap / 2, last = obs[obs.length - 1];
    const prev = last ? (last.top + last.bot) / 2 : H * 0.5;
    const gy = Math.max(lo, Math.min(hi, prev + (Math.random() - 0.5) * H * 0.44));
    obs.push({ x: W + 40, top: gy - gap / 2, bot: gy + gap / 2, w: Math.max(46, U * 12), passed: false });
    if (Math.random() < 0.7) coins.push({ x: W + 40 + U * 30, y: gy + (Math.random() - 0.5) * gap * 0.4, got: false });
  }

  function update(dt) {
    t += dt;
    for (const s of stars) { s.x -= dt * (state === "play" ? speed : 6) * s.z * 0.004; if (s.x < 0) { s.x += 1; s.y = Math.random(); } }
    if (state === "play") {
      const thrust = holding ? -H * 1.9 : 0;
      rocket.vy += (H * 1.15 + thrust) * dt;
      rocket.vy = Math.max(-H * 0.75, Math.min(H * 0.9, rocket.vy));
      rocket.y += rocket.vy * dt;
      rocket.tilt += ((rocket.vy / H) * 0.9 - rocket.tilt) * Math.min(1, dt * 10);
      if (holding && Math.random() < 0.9) parts.push({ x: W * 0.28 - U * 6, y: rocket.y + U * 1.5, vx: -120 - Math.random() * 80, vy: (Math.random() - 0.5) * 60 + 80, life: 0.35, t: 0, c: Math.random() < 0.5 ? "#ffd166" : "#ff7a45", r: 2 + Math.random() * 3 });
      dist += dt * speed * 0.12; speed = 34 + dist * 0.35;
      // paws come at a fixed spacing (about three paws wide, closing in slowly) and the flight speeds up with distance
      const last = obs[obs.length - 1];
      if (!last || last.x < W + 40 - U * Math.max(30, 40 - dist * 0.05)) spawn();
      const vx = U * Math.min(38, 24 + dist * 0.08);
      for (const o of obs) o.x -= vx * dt;
      for (const c of coins) c.x -= vx * dt;
      obs = obs.filter((o) => o.x > -o.w - 20); coins = coins.filter((c) => c.x > -30 && !c.got);
      const rx = W * 0.28, rr = U * 4;
      // the sky is a soft ceiling (the rocket just stops there); only the ground crashes it
      if (rocket.y < rr) { rocket.y = rr; rocket.vy = Math.max(rocket.vy, 0); }
      if (rocket.y > H - rr) return die();
      for (const o of obs) {
        if (rx + rr > o.x && rx - rr < o.x + o.w && (rocket.y - rr < o.top || rocket.y + rr > o.bot)) return die();
        if (!o.passed && o.x + o.w < rx) { o.passed = true; beep(880, 0.05, "triangle", 0.04); }
      }
      for (const c of coins) if (Math.hypot(c.x - rx, c.y - rocket.y) < rr + U * 3) {
        c.got = true; dist += 8; flash = 0.25; beep(1320, 0.09, "square", 0.05, 400);
        for (let i = 0; i < 16; i++) { const a = Math.random() * 7; parts.push({ x: c.x, y: c.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.5, t: 0, c: "#7cf2b0", r: 3 }); }
      }
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter((p) => p.t < p.life);
    shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 2);
  }

  function txt(s, x, y, size, col, align = "center", w = 800) {
    cx.font = `${w} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; cx.textAlign = align; cx.textBaseline = "middle";
    // lines too wide for the screen wrap onto more lines below the first
    let lines = [String(s)];
    if (align === "center" && cx.measureText(lines[0]).width > W - 32) {
      lines = []; let cur = "";
      for (const word of String(s).split(" ")) { const tryL = cur ? cur + " " + word : word; if (cur && cx.measureText(tryL).width > W - 32) { lines.push(cur); cur = word; } else cur = tryL; }
      lines.push(cur);
    }
    lines.forEach((l, i) => { const yy = y + i * size * 1.2; cx.fillStyle = "rgba(0,0,0,0.5)"; cx.fillText(l, x + 2, yy + 3); cx.fillStyle = col; cx.fillText(l, x, yy); });
  }
  function drawRocket(x, y, tilt) {
    cx.save(); cx.translate(x, y); cx.rotate(tilt); const s = U * 1.15;
    // flame
    if (holding || state !== "play") { const f = 1 + Math.sin(t * 40) * 0.25; cx.fillStyle = "#ff7a45"; cx.beginPath(); cx.moveTo(-6 * s, -1.6 * s); cx.lineTo((-6 - 5 * f) * s, 0); cx.lineTo(-6 * s, 1.6 * s); cx.fill(); cx.fillStyle = "#ffd166"; cx.beginPath(); cx.moveTo(-6 * s, -0.9 * s); cx.lineTo((-6 - 3 * f) * s, 0); cx.lineTo(-6 * s, 0.9 * s); cx.fill(); }
    // fins
    cx.fillStyle = "#e84855"; cx.beginPath(); cx.moveTo(-4 * s, -2 * s); cx.lineTo(-7 * s, -4.2 * s); cx.lineTo(-6 * s, -1 * s); cx.fill(); cx.beginPath(); cx.moveTo(-4 * s, 2 * s); cx.lineTo(-7 * s, 4.2 * s); cx.lineTo(-6 * s, 1 * s); cx.fill();
    // body
    cx.fillStyle = "#f4f1ff"; cx.beginPath(); cx.ellipse(0, 0, 7 * s, 2.6 * s, 0, 0, 7); cx.fill();
    cx.fillStyle = "#e84855"; cx.beginPath(); cx.moveTo(4.5 * s, -2 * s); cx.quadraticCurveTo(9 * s, 0, 4.5 * s, 2 * s); cx.closePath(); cx.fill();
    // window with a pilot
    cx.fillStyle = "#2b3a8c"; cx.beginPath(); cx.arc(0.6 * s, 0, 1.6 * s, 0, 7); cx.fill();
    cx.fillStyle = "#7cf2b0"; cx.beginPath(); cx.arc(0.8 * s, 0.1 * s, 1 * s, 0, 7); cx.fill();
    cx.fillStyle = "#0b0d24"; cx.beginPath(); cx.arc(1.1 * s, -0.25 * s, 0.22 * s, 0, 7); cx.arc(0.45 * s, -0.25 * s, 0.22 * s, 0, 7); cx.fill();
    cx.restore();
  }
  function drawPaw(x, y0, y1, fromTop, w) {
    const g = cx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, "#5a3a2a"); g.addColorStop(1, "#7a5038");
    cx.fillStyle = g; cx.beginPath(); cx.roundRect(x, y0, w, y1 - y0, 10); cx.fill();
    // claws at the open end
    const cy0 = fromTop ? y1 : y0, d = fromTop ? 1 : -1;
    cx.fillStyle = "#f0e6d2";
    for (let i = 0; i < 4; i++) { const cxp = x + w * (0.15 + i * 0.235); cx.beginPath(); cx.moveTo(cxp - 4, cy0); cx.lineTo(cxp, cy0 + d * 14); cx.lineTo(cxp + 4, cy0); cx.fill(); }
    cx.fillStyle = "rgba(0,0,0,0.25)"; cx.fillRect(x + w * 0.1, fromTop ? y1 - 16 : y0 + 4, w * 0.8, 12);
  }

  function draw() {
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#090a1f"); g.addColorStop(1, "#1c1650");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.save();
    if (shake) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    for (const s of stars) { cx.globalAlpha = 0.3 + s.z * 0.7; cx.fillStyle = "#fff"; cx.fillRect(s.x * W, s.y * H, s.z * 2.2, s.z * 2.2); }
    cx.globalAlpha = 1;
    // the moon, growing as you climb
    const mr = U * (10 + Math.min(40, dist * 0.15));
    cx.fillStyle = "#fff6d6"; cx.shadowColor = "#fff6d6"; cx.shadowBlur = 40; cx.beginPath(); cx.arc(W * 0.86, H * 0.11, mr, 0, 7); cx.fill(); cx.shadowBlur = 0;
    cx.fillStyle = "rgba(200,190,160,0.5)"; for (const [a, b, r] of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.12], [-0.05, 0.35, 0.1]]) { cx.beginPath(); cx.arc(W * 0.86 + a * mr, H * 0.11 + b * mr, r * mr, 0, 7); cx.fill(); }
    for (const o of obs) { drawPaw(o.x, -20, o.top, true, o.w); drawPaw(o.x, o.bot, H + 20, false, o.w); }
    for (const c of coins) { const bob = Math.sin(t * 6 + c.x * 0.02) * 4; cx.fillStyle = "#7cf2b0"; cx.shadowColor = "#7cf2b0"; cx.shadowBlur = 16; cx.beginPath(); cx.roundRect(c.x - U * 1.1, c.y - U * 2.4 + bob, U * 2.2, U * 4.8, 3); cx.fill(); cx.shadowBlur = 0; cx.fillStyle = "#c9ffe2"; cx.fillRect(c.x - 1, c.y - U * 3.6 + bob, 2, U * 7.2); }
    for (const p of parts) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
    if (state === "play" || state === "over") drawRocket(COVER ? W * 0.4 : W * 0.28, rocket.y, rocket.tilt);
    else drawRocket(W * 0.5, H * 0.58 + Math.sin(t * 2) * 10, -0.5);
    cx.restore();
    if (flash) { cx.fillStyle = `rgba(255,255,255,${flash * 0.25})`; cx.fillRect(0, 0, W, H); }
    const s = Math.min(W, H);
    if (state === "play" && !COVER) {
      txt("MARKET CAP", 20, 24, 12, "#a8a6d6", "left", 700);
      txt(mcap(dist), 20, 50, 28, "#7cf2b0", "left");
      txt("ATH " + mcap(best), W - 20, 36, 15, "#ffd166", "right");
    }
    if (state === "title") {
      txt("TO THE MOON", W / 2, H * 0.24, s * 0.12, "#fff6d6");
      txt("Tap or hold to boost. Let go to fall.", W / 2, H * 0.24 + s * 0.1, Math.max(15, s * 0.04), "#f4f1ff", "center", 600);
      txt("Dodge the bear paws, grab green candles.", W / 2, H * 0.24 + s * 0.155, Math.max(13, s * 0.032), "#a8a6d6", "center", 600);
      txt("Space / mouse / finger: tap or hold", W / 2, H * 0.82, Math.max(13, s * 0.03), "#a8a6d6", "center", 700);
      txt("Press Space or tap to launch", W / 2, H * 0.89, Math.max(16, s * 0.045), `rgba(255,209,102,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
    if (state === "over") {
      cx.fillStyle = "rgba(9,10,31,0.6)"; cx.fillRect(0, 0, W, H);
      txt("CRASHED", W / 2, H * 0.32, s * 0.14, "#e84855");
      txt("Peak market cap " + mcap(dist), W / 2, H * 0.32 + s * 0.12, Math.max(16, s * 0.045), "#f4f1ff");
      txt("ATH this session " + mcap(best), W / 2, H * 0.32 + s * 0.18, Math.max(14, s * 0.035), "#ffd166", "center", 700);
      txt("Press Space or tap to launch again", W / 2, H * 0.74, Math.max(16, s * 0.042), `rgba(255,255,255,${0.6 + Math.sin(t * 4) * 0.4})`);
    }
  }

  // after a crash a short pause before a tap restarts, so a finger still held down does not relaunch at once
  const press = () => {
    wake();
    if (state === "over" && performance.now() - overAt < 450) return;
    if (state !== "play") start();
    holding = true;
    // every press kicks the rocket up, so a tap works like a flap; holding keeps the boost on
    rocket.vy = Math.min(rocket.vy, -H * 0.45);
  };
  const release = () => { holding = false; };
  window.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) press(); } });
  window.addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Enter") release(); });
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  ["touchstart", "touchmove"].forEach((ev) => cv.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  window.addEventListener("blur", release);

  let last = performance.now(), hidden = false;
  document.addEventListener("visibilitychange", () => { hidden = document.hidden; last = performance.now(); holding = false; });
  function frame(now) { const dt = Math.min(1 / 30, (now - last) / 1000); last = now; if (!hidden) { update(dt); draw(); } requestAnimationFrame(frame); }
  // #cover: a still for the thumbnail (the rocket climbing between two bear paws toward a green candle, no HUD)
  const COVER = location.hash === "#cover";
  resize(); reset();
  if (COVER) {
    state = "play"; holding = true; dist = 70;
    rocket = { y: H * 0.5, vy: 0, tilt: -0.32 };
    obs = [{ x: W * 0.62, top: H * 0.3, bot: H * 0.66, w: Math.max(46, U * 12), passed: false }];
    coins = [{ x: W * 0.69, y: H * 0.47, got: false }];
    for (let i = 0; i < 14; i++) parts.push({ x: W * 0.4 - U * (8 + i * 2.2), y: H * 0.5 + U * (3 + i * 1.1) + (i % 3 - 1) * U, vx: 0, vy: 0, life: 1, t: i * 0.06, c: i % 2 ? "#ffd166" : "#ff7a45", r: Math.max(1.5, U * (1.4 - i * 0.07)) });
    update = () => {};
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
