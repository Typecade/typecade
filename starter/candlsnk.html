<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candle Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1418; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById("c"), cx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, cell = 24, cols = 20, rows = 20, ox = 0, oy = 0;
  const C = { bg: "#0d1418", board: "#13202a", grid: "#182a36", body: "#3ddc84", body2: "#2bb36a", head: "#7cf2b0", candle: "#3ddc84", wick: "#b8ffd6", red: "#e84855", red2: "#ff9aa2", text: "#f4f7f5", dim: "#7d93a3", gold: "#ffd166" };

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const top = 70, pad = 14;
    const portrait = H > W;
    cols = portrait ? 16 : 22;
    cell = Math.floor(Math.min((W - pad * 2) / cols, (H - top - pad * 2) / (portrait ? 22 : 16)));
    rows = Math.floor((H - top - pad * 2) / cell);
    cols = Math.floor((W - pad * 2) / cell);
    ox = Math.floor((W - cols * cell) / 2); oy = top + Math.floor((H - top - pad - rows * cell) / 2);
  }
  window.addEventListener("resize", () => { resize(); if (state !== "play") reset(); });

  // ---- sound
  let ac = null;
  function beep(f, d = 0.08, type = "square", v = 0.06, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  }
  function wake() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }

  // ---- state
  let state = "title", snake, dir, nextDir, food, reds, score, best = 0, stepT, stepEvery, redT, time, parts = [], shake = 0, flash = 0, deathMsg = "";
  function reset() {
    const sx = Math.floor(cols / 2), sy = Math.floor(rows / 2);
    snake = [{ x: sx, y: sy }, { x: sx - 1, y: sy }, { x: sx - 2, y: sy }];
    dir = { x: 1, y: 0 }; nextDir = dir; reds = []; score = 0; stepT = 0; stepEvery = 0.16; redT = 2.5; time = 0; parts = [];
    placeFood();
  }
  const occupied = (x, y) => snake.some((s) => s.x === x && s.y === y) || reds.some((r) => r.x === x && r.y === y);
  function freeCell() {
    for (let i = 0; i < 400; i++) {
      const x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows);
      const h = snake[0];
      if (!occupied(x, y) && !(food && food.x === x && food.y === y) && Math.abs(h.x - x) + Math.abs(h.y - y) > 3) return { x, y };
    }
    return { x: 0, y: 0 };
  }
  function placeFood() { food = null; food = { ...freeCell(), born: time }; }
  const mcap = (s) => s >= 1000 ? "$" + (s / 1000).toFixed(2) + "M" : "$" + s + "k";

  function burst(x, y, col, n = 14, sp = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.4, t: 0, col, r: 2 + Math.random() * 3 });
    }
  }

  function start() { wake(); reset(); state = "play"; beep(520, 0.1, "square", 0.05, 300); }
  function die(msg) {
    state = "over"; deathMsg = msg; best = Math.max(best, score); shake = 14; flash = 1;
    const h = snake[0]; burst(ox + h.x * cell + cell / 2, oy + h.y * cell + cell / 2, C.red, 40, 260);
    beep(220, 0.5, "sawtooth", 0.07, -180);
  }

  function turn(x, y) {
    if (state !== "play") return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  function step() {
    dir = nextDir;
    const h = snake[0];
    let nx = (h.x + dir.x + cols) % cols, ny = (h.y + dir.y + rows) % rows;
    if (snake.some((s, i) => i < snake.length - 1 && s.x === nx && s.y === ny)) return die("You ate your own bag");
    const red = reds.find((r) => r.x === nx && r.y === ny && r.live);
    if (red) return die("RED CANDLE");
    snake.unshift({ x: nx, y: ny });
    if (food && nx === food.x && ny === food.y) {
      score += 3 + Math.floor(snake.length / 4);
      burst(ox + nx * cell + cell / 2, oy + ny * cell + cell / 2, C.candle, 18, 200);
      beep(660 + Math.min(600, score * 4), 0.07, "square", 0.05, 200);
      stepEvery = Math.max(0.065, 0.16 - snake.length * 0.0025);
      placeFood();
    } else snake.pop();
  }

  function spawnRed() {
    const p = freeCell();
    reds.push({ x: p.x, y: p.y, born: time, live: false, ttl: 7 + Math.random() * 3 });
    beep(180, 0.12, "triangle", 0.05);
  }

  let update = function (dt) {
    time += dt;
    if (state === "play") {
      stepT += dt;
      while (stepT >= stepEvery && state === "play") { stepT -= stepEvery; step(); }
      redT -= dt;
      const maxReds = 2 + Math.floor(score / 18);
      if (redT <= 0) { if (reds.length < maxReds) spawnRed(); redT = Math.max(0.9, 3 - score / 60); }
      for (const r of reds) {
        const age = time - r.born;
        if (!r.live && age > 1.3) { r.live = true; if (snake.some((s) => s.x === r.x && s.y === r.y)) { r.live = false; r.ttl = 0; } }
      }
      reds = reds.filter((r) => time - r.born < r.ttl);
    }
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
    parts = parts.filter((p) => p.t < p.life);
    shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 2.5);
  };

  // ---- drawing
  function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
  function text(s, x, y, size, col, align = "center", w = 800) {
    cx.font = `${w} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; cx.textAlign = align; cx.textBaseline = "middle";
    // lines too wide for the screen wrap onto more lines below the first
    let lines = [String(s)];
    if (align === "center" && cx.measureText(lines[0]).width > W - 32) {
      lines = []; let cur = "";
      for (const word of String(s).split(" ")) { const tryL = cur ? cur + " " + word : word; if (cur && cx.measureText(tryL).width > W - 32) { lines.push(cur); cur = word; } else cur = tryL; }
      lines.push(cur);
    }
    lines.forEach((l, i) => { const yy = y + i * size * 1.2; cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillText(l, x + 2, yy + 3); cx.fillStyle = col; cx.fillText(l, x, yy); });
  }
  function drawCandle(x, y, s, t) {
    const bob = Math.sin(t * 5) * s * 0.06;
    const bw = s * 0.36, bh = s * 0.56, bx = x + (s - bw) / 2, by = y + s * 0.24 + bob;
    cx.fillStyle = C.wick; cx.fillRect(x + s / 2 - 1.5, y + s * 0.08 + bob, 3, s * 0.84);
    cx.shadowColor = C.candle; cx.shadowBlur = 14;
    cx.fillStyle = C.candle; rr(bx, by, bw, bh, 3); cx.fill();
    cx.shadowBlur = 0;
  }
  function drawRed(r) {
    const x = ox + r.x * cell, y = oy + r.y * cell, age = time - r.born;
    if (!r.live) {
      const blink = Math.floor(age * 8) % 2 === 0;
      cx.strokeStyle = blink ? C.red : C.red2; cx.lineWidth = 2; cx.setLineDash([4, 3]);
      cx.strokeRect(x + 3, y + 3, cell - 6, cell - 6); cx.setLineDash([]);
      text("!", x + cell / 2, y + cell / 2 + 1, cell * 0.6, blink ? C.red : C.red2);
      return;
    }
    const left = r.ttl - age;
    cx.globalAlpha = left < 1 ? Math.max(0, left) : 1;
    // a red candle: wick above and below a solid body
    cx.fillStyle = C.red2;
    cx.fillRect(x + cell / 2 - 1, y + cell * 0.06, 2, cell * 0.2);
    cx.fillRect(x + cell / 2 - 1, y + cell * 0.74, 2, cell * 0.2);
    cx.fillStyle = C.red; rr(x + cell * 0.28, y + cell * 0.22, cell * 0.44, cell * 0.56, 3); cx.fill();
    cx.fillStyle = "rgba(255,255,255,0.18)"; cx.fillRect(x + cell * 0.33, y + cell * 0.27, cell * 0.08, cell * 0.44);
    cx.globalAlpha = 1;
  }
  function drawSnake() {
    for (let i = snake.length - 1; i >= 1; i--) {
      const s = snake[i], x = ox + s.x * cell, y = oy + s.y * cell, k = 1 - i / (snake.length + 4);
      cx.fillStyle = i % 2 ? C.body : C.body2;
      const m = cell * (0.12 + (1 - k) * 0.08);
      rr(x + m, y + m, cell - m * 2, cell - m * 2, cell * 0.28); cx.fill();
    }
    const h = snake[0], x = ox + h.x * cell, y = oy + h.y * cell;
    cx.fillStyle = C.head; rr(x + 1, y + 1, cell - 2, cell - 2, cell * 0.36); cx.fill();
    // headset
    cx.strokeStyle = "#1b2b36"; cx.lineWidth = Math.max(2, cell * 0.09);
    cx.beginPath(); cx.arc(x + cell / 2, y + cell * 0.55, cell * 0.42, Math.PI * 1.1, Math.PI * 1.9); cx.stroke();
    // eyes look where it goes
    const ex = dir.x * cell * 0.1, ey = dir.y * cell * 0.1;
    for (const sx of [-0.18, 0.18]) {
      cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(x + cell / 2 + sx * cell + ex, y + cell * 0.45 + ey, cell * 0.13, 0, 7); cx.fill();
      cx.fillStyle = "#10202a"; cx.beginPath(); cx.arc(x + cell / 2 + sx * cell + ex * 1.6, y + cell * 0.45 + ey * 1.6, cell * 0.065, 0, 7); cx.fill();
    }
    cx.strokeStyle = "#10202a"; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(x + cell / 2 + ex, y + cell * 0.62 + ey, cell * 0.12, 0.15 * Math.PI, 0.85 * Math.PI); cx.stroke();
  }

  function draw() {
    cx.save();
    cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
    if (shake > 0) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // board
    cx.fillStyle = C.board; rr(ox - 6, oy - 6, cols * cell + 12, rows * cell + 12, 14); cx.fill();
    cx.strokeStyle = C.grid; cx.lineWidth = 1;
    for (let i = 1; i < cols; i++) { cx.beginPath(); cx.moveTo(ox + i * cell + 0.5, oy); cx.lineTo(ox + i * cell + 0.5, oy + rows * cell); cx.stroke(); }
    for (let j = 1; j < rows; j++) { cx.beginPath(); cx.moveTo(ox, oy + j * cell + 0.5); cx.lineTo(ox + cols * cell, oy + j * cell + 0.5); cx.stroke(); }
    if (state !== "title") {
      for (const r of reds) drawRed(r);
      if (food) drawCandle(ox + food.x * cell, oy + food.y * cell, cell, time);
      drawSnake();
    }
    for (const p of parts) { cx.globalAlpha = 1 - p.t / p.life; cx.fillStyle = p.col; cx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
    cx.globalAlpha = 1;
    cx.restore();
    // HUD
    if (state !== "title" && !COVER) {
      text("MARKET CAP", 18, 24, 12, C.dim, "left", 700);
      text(mcap(score), 18, 48, 26, C.candle, "left");
      text("ATH " + mcap(best), W - 18, 36, 16, C.gold, "right", 800);
    }
    if (flash > 0) { cx.fillStyle = `rgba(232,72,85,${flash * 0.35})`; cx.fillRect(0, 0, W, H); }
    const s = Math.min(W, H);
    if (state === "title") {
      cx.fillStyle = "rgba(13,20,24,0.78)"; cx.fillRect(0, 0, W, H);
      text("CANDLE SNAKE", W / 2, H * 0.32, s * 0.12, C.candle);
      text("Eat green candles. Pump the market cap.", W / 2, H * 0.32 + s * 0.11, Math.max(14, s * 0.035), C.text, "center", 600);
      text("Red candles blink, then land. Don't touch them.", W / 2, H * 0.32 + s * 0.16, Math.max(13, s * 0.03), C.dim, "center", 600);
      text("Arrows / WASD  ·  swipe on phone", W / 2, H * 0.62, Math.max(13, s * 0.03), C.dim, "center", 700);
      const pulse = 0.6 + Math.sin(time * 4) * 0.4;
      text("Press Space or tap to start", W / 2, H * 0.72, Math.max(16, s * 0.045), `rgba(255,209,102,${pulse})`);
    } else if (state === "over") {
      cx.fillStyle = "rgba(13,20,24,0.72)"; cx.fillRect(0, 0, W, H);
      text(deathMsg, W / 2, H * 0.34, s * 0.11, C.red);
      text("Final market cap " + mcap(score), W / 2, H * 0.34 + s * 0.11, Math.max(16, s * 0.045), C.text);
      text("ATH this session " + mcap(best), W / 2, H * 0.34 + s * 0.17, Math.max(14, s * 0.035), C.gold, "center", 700);
      const pulse = 0.6 + Math.sin(time * 4) * 0.4;
      text("Press Space or tap to play again", W / 2, H * 0.7, Math.max(16, s * 0.042), `rgba(255,255,255,${pulse})`);
    }
  }

  // ---- input
  const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  window.addEventListener("keydown", (e) => {
    if (KEYS[e.code]) { e.preventDefault(); turn(...KEYS[e.code]); }
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (state !== "play") start(); }
  });
  let tx = 0, ty = 0, tracking = false;
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); tracking = true; tx = e.clientX; ty = e.clientY; if (state !== "play") start(); });
  cv.addEventListener("pointermove", (e) => {
    if (!tracking || state !== "play") return;
    const dx = e.clientX - tx, dy = e.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    tx = e.clientX; ty = e.clientY;
  });
  window.addEventListener("pointerup", () => (tracking = false));
  ["touchstart", "touchmove"].forEach((ev) => cv.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));

  // ---- loop
  let last = performance.now(), hidden = false;
  document.addEventListener("visibilitychange", () => { hidden = document.hidden; last = performance.now(); });
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (!hidden) { update(dt); draw(); }
    requestAnimationFrame(frame);
  }
  // #cover: a still for the thumbnail (a long snake, a green candle, two red ones and a blinking one, no HUD)
  const COVER = location.hash === "#cover";
  resize(); reset();
  if (COVER) {
    state = "play"; time = 0.2;
    const cx0 = Math.floor(cols / 2) - 3, cy0 = Math.floor(rows / 2);
    snake = [];
    for (let i = 0; i < 6; i++) snake.push({ x: cx0 + 5 - i, y: cy0 });
    for (let i = 1; i <= 4; i++) snake.push({ x: cx0, y: cy0 + i });
    for (let i = 1; i <= 4; i++) snake.push({ x: cx0 - i, y: cy0 + 4 });
    dir = { x: 1, y: 0 };
    food = { x: cx0 + 8, y: cy0, born: 0 };
    reds = [{ x: cx0 + 6, y: cy0 - 3, born: -5, live: true, ttl: 1e9 }, { x: cx0 + 3, y: cy0 + 3, born: -5, live: true, ttl: 1e9 }, { x: cx0 - 3, y: cy0 + 1, born: 0, live: false, ttl: 1e9 }];
    update = () => {};
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
